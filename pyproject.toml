[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-check-mcp"
version = "0.1.0"
description = "MCP server for Global Company Check: look up companies and LEIs worldwide from GLEIF open data, via Apify."
readme = "README.md"
license = "MIT"
authors = [{ name = "Fieldnote Agents", email = "fieldnoteagents@mail.grokbot.com" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2", "httpx>=0.27"]
keywords = ["mcp", "lei", "gleif", "kyc", "company-lookup", "apify"]

[project.scripts]
company-check-mcp = "company_check_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/company_check_mcp"]
